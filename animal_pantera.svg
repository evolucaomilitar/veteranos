<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="animal-svg animal-pantera" width="100%" height="100%">
  <defs>
    <linearGradient id="panteraDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="35%" stop-color="#1e293b"/>
      <stop offset="75%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="panteraGlowGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="panteraCyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="panteraShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#panteraShadow)">
    <!-- Orelhas Táticas da Pantera Negra -->
    <path d="M18 29 C14 17 26 13 34 21 C33 28 25 32 18 29 Z" fill="#0f172a"/>
    <path d="M21 27 C19 20 25 17 30 23 C29 26 25 28 21 27 Z" fill="#1e293b"/>
    <path d="M23 26 C22 22 26 20 28 24 Z" fill="#475569"/>

    <path d="M82 29 C86 17 74 13 66 21 C67 28 75 32 82 29 Z" fill="#0f172a"/>
    <path d="M79 27 C81 20 75 17 70 23 C71 26 75 28 79 27 Z" fill="#1e293b"/>
    <path d="M77 26 C78 22 74 20 72 24 Z" fill="#475569"/>

    <!-- Cabeça da Pantera Negra -->
    <path d="M50 17 C68 17 80 27 82 44 C84 60 76 75 66 83 C57 89 53 90 50 90 C47 90 43 89 34 83 C24 75 16 60 18 44 C20 27 32 17 50 17 Z" fill="url(#panteraDark)"/>

    <!-- Pêlos e Maxilar Saliente -->
    <path d="M18 48 L12 55 L20 58 L14 66 L24 68" stroke="#334155" stroke-width="1.8" fill="url(#panteraDark)"/>
    <path d="M82 48 L88 55 L80 58 L86 66 L76 68" stroke="#334155" stroke-width="1.8" fill="url(#panteraDark)"/>

    <!-- Destaque Muscular da Cabeça (Luz Tática) -->
    <path d="M50 19 C62 19 72 26 74 38" stroke="#475569" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M50 20 L50 36" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <path d="M43 28 C47 32 49 34 50 38" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M57 28 C53 32 51 34 50 38" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Olhar Tático Penetrante: Olhos Esmeralda Brilhantes da Pantera -->
    <path d="M30 43 C35 38 43 40 46 45 C41 48 34 48 30 43 Z" fill="#020617"/>
    <ellipse cx="37.5" cy="44.5" rx="5" ry="3.2" fill="url(#panteraGlowGreen)"/>
    <ellipse cx="37.5" cy="44.5" rx="1.6" ry="3" fill="#020617"/>
    <circle cx="39" cy="43.2" r="0.9" fill="#fff"/>
    <circle cx="36.5" cy="45.5" r="0.5" fill="#a7f3d0"/>

    <path d="M70 43 C65 38 57 40 54 45 C59 48 66 48 70 43 Z" fill="#020617"/>
    <ellipse cx="62.5" cy="44.5" rx="5" ry="3.2" fill="url(#panteraGlowGreen)"/>
    <ellipse cx="62.5" cy="44.5" rx="1.6" ry="3" fill="#020617"/>
    <circle cx="64" cy="43.2" r="0.9" fill="#fff"/>
    <circle cx="61.5" cy="45.5" r="0.5" fill="#a7f3d0"/>

    <!-- Linhas dos Olhos e Rugas do Focinho Rosnando -->
    <path d="M29 43 L21 41" stroke="#020617" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M71 43 L79 41" stroke="#020617" stroke-width="2.5" stroke-linecap="round"/>

    <path d="M45 46 C47 48 49 48 50 48 C51 48 53 48 55 46" stroke="#475569" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M44 49 C47 52 49 52 50 52 C51 52 53 52 56 49" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Focinho Escuro/Carvão da Pantera -->
    <path d="M50 56 C44 56 36 60 36 68 C36 74 43 77 50 77 C57 77 64 74 64 68 C64 60 56 56 50 56 Z" fill="#0b0f19" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Nariz da Pantera (Preto Carvão com Brilho Superior) -->
    <path d="M44 57 C47 55 53 55 56 57 C57 61 54 65 50 66 C46 65 43 61 44 57 Z" fill="#020617"/>
    <ellipse cx="50" cy="58" rx="4" ry="1.2" fill="#334155"/>

    <!-- Divisória Labial e Fangs (Presas Afiadas da Pantera) -->
    <path d="M50 66 L50 72" stroke="#020617" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M41 71 C45 74 50 74 50 74 C50 74 55 74 59 71" stroke="#020617" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Presas Afiadas da Pantera Negra -->
    <path d="M41 71 L42 77 L44.5 71 Z" fill="#f8fafc" stroke="#020617" stroke-width="0.8"/>
    <path d="M59 71 L58 77 L55.5 71 Z" fill="#f8fafc" stroke="#020617" stroke-width="0.8"/>

    <!-- Dentes Menores Incisivos -->
    <path d="M45.5 72 L46.5 74.5 L47.5 72 Z" fill="#e2e8f0"/>
    <path d="M48.5 72 L49.5 74.5 L50.5 72 Z" fill="#e2e8f0"/>
    <path d="M51.5 72 L52.5 74.5 L53.5 72 Z" fill="#e2e8f0"/>

    <!-- Bigodes Prateados Ferozes da Pantera -->
    <path d="M37 67 L18 64" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
    <path d="M36 70 L16 71" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
    <path d="M37 73 L20 78" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>

    <path d="M63 67 L82 64" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
    <path d="M64 70 L84 71" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
    <path d="M63 73 L80 78" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>

    <!-- Queixo Inferior Sombrio -->
    <path d="M45 77 C47 84 53 84 55 77 Z" fill="#0f172a" stroke="#020617" stroke-width="1.2"/>
  </g>
</svg>
