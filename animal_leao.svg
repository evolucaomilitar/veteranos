<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="animal-svg animal-leao" width="100%" height="100%">
  <defs>
    <linearGradient id="leaoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="leaoMane" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <radialGradient id="leaoEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <filter id="leaoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#leaoGlow)">
    <!-- Juba Externa Majestosa -->
    <path d="M50 8 C60 8 72 13 80 23 C88 33 93 45 91 58 C89 71 80 83 69 90 C61 95 53 96 50 96 C47 96 39 95 31 90 C20 83 11 71 9 58 C7 45 12 33 20 23 C28 13 40 8 50 8 Z" fill="url(#leaoMane)"/>
    
    <!-- Mechas Pontiagudas da Juba -->
    <!-- Topo -->
    <path d="M50 4 L55 14 L45 14 Z" fill="#b45309"/>
    <path d="M62 7 L65 18 L56 16 Z" fill="#b45309"/>
    <path d="M38 7 L44 16 L35 18 Z" fill="#b45309"/>
    <!-- Laterais Superiores -->
    <path d="M76 14 L75 26 L67 21 Z" fill="#78350f"/>
    <path d="M24 14 L33 21 L25 26 Z" fill="#78350f"/>
    <path d="M87 25 L82 37 L76 30 Z" fill="#92400e"/>
    <path d="M13 25 L24 30 L18 37 Z" fill="#92400e"/>
    <!-- Laterais Centrais -->
    <path d="M94 40 L85 49 L82 41 Z" fill="#78350f"/>
    <path d="M6 40 L18 41 L15 49 Z" fill="#78350f"/>
    <path d="M93 57 L83 63 L83 54 Z" fill="#92400e"/>
    <path d="M7 57 L17 54 L17 63 Z" fill="#92400e"/>
    <!-- Laterais Inferiores -->
    <path d="M87 72 L76 75 L79 66 Z" fill="#78350f"/>
    <path d="M13 72 L21 66 L24 75 Z" fill="#78350f"/>
    <path d="M77 86 L66 85 L72 78 Z" fill="#92400e"/>
    <path d="M23 86 L28 78 L34 85 Z" fill="#92400e"/>
    <!-- Base da Juba -->
    <path d="M50 99 L56 89 L44 89 Z" fill="#451a03"/>
    <path d="M63 94 L66 86 L57 87 Z" fill="#451a03"/>
    <path d="M37 94 L43 87 L34 86 Z" fill="#451a03"/>

    <!-- Orelhas -->
    <path d="M23 26 C21 21 24 16 30 17 C34 18 36 22 35 27 Z" fill="url(#leaoGold)"/>
    <path d="M25 25 C24 22 26 19 29 20 C31 21 32 23 31 26 Z" fill="#78350f"/>
    
    <path d="M77 26 C79 21 76 16 70 17 C66 18 64 22 65 27 Z" fill="url(#leaoGold)"/>
    <path d="M75 25 C76 22 74 19 71 20 C69 21 68 23 69 26 Z" fill="#78350f"/>

    <!-- Rosto do Leão -->
    <path d="M50 20 C64 20 73 30 73 47 C73 60 67 72 50 78 C33 72 27 60 27 47 C27 30 36 20 50 20 Z" fill="url(#leaoGold)"/>

    <!-- Testa e Linhas de Expressão Tática -->
    <path d="M50 22 L50 36" stroke="#92400e" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M44 26 C47 30 50 32 50 36" stroke="#92400e" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M56 26 C53 30 50 32 50 36" stroke="#92400e" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Sobrancelhas Marcantes -->
    <path d="M33 39 C38 37 44 38 46 41" stroke="#451a03" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M67 39 C62 37 56 38 54 41" stroke="#451a03" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Olhos Penetrantes de Predador -->
    <path d="M34 42 C38 40 43 42 45 45 C42 46 37 46 34 42 Z" fill="#18181b"/>
    <ellipse cx="39.5" cy="43.5" rx="3.5" ry="2.2" fill="url(#leaoEye)"/>
    <circle cx="39.5" cy="43.5" r="1.3" fill="#000"/>
    <circle cx="40.5" cy="42.7" r="0.6" fill="#fff"/>

    <path d="M66 42 C62 40 57 42 55 45 C58 46 63 46 66 42 Z" fill="#18181b"/>
    <ellipse cx="60.5" cy="43.5" rx="3.5" ry="2.2" fill="url(#leaoEye)"/>
    <circle cx="60.5" cy="43.5" r="1.3" fill="#000"/>
    <circle cx="61.5" cy="42.7" r="0.6" fill="#fff"/>

    <!-- Ponte do Nariz -->
    <path d="M46 41 L45 54 L50 56 L55 54 L54 41" fill="#fef08a" opacity="0.3"/>
    <path d="M45 42 L44 54" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M55 42 L56 54" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Nariz Triangular Escuro -->
    <path d="M43 53 C46 52 54 52 57 53 C58 56 54 61 50 62 C46 61 42 56 43 53 Z" fill="#261005"/>
    <ellipse cx="50" cy="54" rx="4" ry="1.2" fill="#78350f"/>

    <!-- Focinho / Bochechas Douradas Claras -->
    <path d="M50 62 C45 62 38 64 38 70 C38 74 44 76 50 76 C56 76 62 74 62 70 C62 64 55 62 50 62 Z" fill="#fef9c3"/>
    <path d="M50 62 L50 72" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>
    <path d="M42 70 C45 72 50 72 50 72 C50 72 55 72 58 70" stroke="#451a03" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Pontos dos Bigodes -->
    <circle cx="42" cy="67" r="0.8" fill="#451a03"/>
    <circle cx="45" cy="68" r="0.8" fill="#451a03"/>
    <circle cx="43" cy="70" r="0.8" fill="#451a03"/>
    <circle cx="58" cy="67" r="0.8" fill="#451a03"/>
    <circle cx="55" cy="68" r="0.8" fill="#451a03"/>
    <circle cx="57" cy="70" r="0.8" fill="#451a03"/>

    <!-- Bigodes Táticos -->
    <path d="M37 68 L24 65" stroke="#fef08a" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
    <path d="M36 71 L22 72" stroke="#fef08a" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
    <path d="M38 73 L26 78" stroke="#fef08a" stroke-width="1" stroke-linecap="round" opacity="0.8"/>

    <path d="M63 68 L76 65" stroke="#fef08a" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
    <path d="M64 71 L78 72" stroke="#fef08a" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
    <path d="M62 73 L74 78" stroke="#fef08a" stroke-width="1" stroke-linecap="round" opacity="0.8"/>

    <!-- Queixo Forte do Leão -->
    <path d="M46 75 C47 80 53 80 54 75 Z" fill="#fef08a"/>
    <path d="M46 76 C48 83 52 83 54 76 Z" stroke="#b45309" stroke-width="1" fill="#92400e"/>
  </g>
</svg>
