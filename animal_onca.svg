<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="animal-svg animal-onca" width="100%" height="100%">
  <defs>
    <linearGradient id="oncaCoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="oncaEye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="50%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
    <filter id="oncaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#oncaGlow)">
    <!-- Formato da Cabeça Tática da Onça -->
    <!-- Orelhas com Borda Preta e Centro Branco -->
    <path d="M19 28 C15 16 26 12 35 20 C33 28 25 32 19 28 Z" fill="#18181b"/>
    <path d="M22 26 C20 19 26 16 31 22 C30 26 25 28 22 26 Z" fill="#f8fafc"/>
    <path d="M24 25 C23 21 27 19 29 23 Z" fill="#f59e0b"/>

    <path d="M81 28 C85 16 74 12 65 20 C67 28 75 32 81 28 Z" fill="#18181b"/>
    <path d="M78 26 C80 19 74 16 69 22 C70 26 75 28 78 26 Z" fill="#f8fafc"/>
    <path d="M76 25 C77 21 73 19 71 23 Z" fill="#f59e0b"/>

    <!-- Contorno Musculoso da Cabeça -->
    <path d="M50 16 C67 16 78 26 80 43 C82 58 75 74 65 82 C57 88 53 89 50 89 C47 89 43 88 35 82 C25 74 18 58 20 43 C22 26 33 16 50 16 Z" fill="url(#oncaCoat)"/>

    <!-- Bochechas e Pêlos Laterais -->
    <path d="M19 46 L13 54 L21 57 L15 65 L25 67" stroke="#92400e" stroke-width="1.8" fill="url(#oncaCoat)"/>
    <path d="M81 46 L87 54 L79 57 L85 65 L75 67" stroke="#92400e" stroke-width="1.8" fill="url(#oncaCoat)"/>

    <!-- PINTAS / ROSETAS CARACTERÍSTICAS DA ONÇA-PINTADA -->
    <!-- Rosetas na Testa -->
    <path d="M48 20 C46 22 47 24 50 24 C52 24 53 22 51 20 Z" fill="#18181b"/>
    <path d="M41 23 C39 25 41 27 43 26 C43 24 42 23 41 23 Z" fill="#18181b"/>
    <path d="M59 23 C61 25 59 27 57 26 C57 24 58 23 59 23 Z" fill="#18181b"/>

    <!-- Rosetas Marcantes das Têmporas -->
    <!-- Esquerda -->
    <circle cx="33" cy="30" r="2.8" fill="#18181b"/>
    <circle cx="33" cy="30" r="1.3" fill="#b45309"/>
    <circle cx="26" cy="37" r="3.2" fill="#18181b"/>
    <circle cx="26" cy="37" r="1.5" fill="#b45309"/>
    <circle cx="23" cy="48" r="3" fill="#18181b"/>
    <circle cx="23" cy="48" r="1.4" fill="#b45309"/>
    <circle cx="28" cy="58" r="3.5" fill="#18181b"/>
    <circle cx="28" cy="58" r="1.6" fill="#b45309"/>

    <!-- Direita -->
    <circle cx="67" cy="30" r="2.8" fill="#18181b"/>
    <circle cx="67" cy="30" r="1.3" fill="#b45309"/>
    <circle cx="74" cy="37" r="3.2" fill="#18181b"/>
    <circle cx="74" cy="37" r="1.5" fill="#b45309"/>
    <circle cx="77" cy="48" r="3" fill="#18181b"/>
    <circle cx="77" cy="48" r="1.4" fill="#b45309"/>
    <circle cx="72" cy="58" r="3.5" fill="#18181b"/>
    <circle cx="72" cy="58" r="1.6" fill="#b45309"/>

    <!-- Listras de Guerra Acima dos Olhos -->
    <path d="M42 32 C45 35 46 38 45 42" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M58 32 C55 35 54 38 55 42" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M50 28 L50 37" stroke="#18181b" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Olhos Verdes Ferozes de Onça -->
    <path d="M30 43 C35 39 42 41 45 46 C41 48 34 48 30 43 Z" fill="#09090b"/>
    <ellipse cx="37.5" cy="44.5" rx="4.5" ry="2.8" fill="url(#oncaEye)"/>
    <ellipse cx="37.5" cy="44.5" rx="1.6" ry="2.6" fill="#000"/>
    <circle cx="39" cy="43.5" r="0.7" fill="#fff"/>

    <path d="M70 43 C65 39 58 41 55 46 C59 48 66 48 70 43 Z" fill="#09090b"/>
    <ellipse cx="62.5" cy="44.5" rx="4.5" ry="2.8" fill="url(#oncaEye)"/>
    <ellipse cx="62.5" cy="44.5" rx="1.6" ry="2.6" fill="#000"/>
    <circle cx="64" cy="43.5" r="0.7" fill="#fff"/>

    <!-- Linhas Marcantes dos Olhos estilo Maquiagem Natural de Felino -->
    <path d="M29 44 L24 43" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
    <path d="M71 44 L76 43" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
    <path d="M33 47 L30 52" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
    <path d="M67 47 L70 52" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>

    <!-- Focinho Claro -->
    <path d="M50 56 C44 56 36 60 36 68 C36 74 43 76 50 76 C57 76 64 74 64 68 C64 60 56 56 50 56 Z" fill="#fef9c3"/>

    <!-- Nariz Rosa-Escuro / Preto da Onça -->
    <path d="M44 56 C47 55 53 55 56 56 C57 60 54 64 50 65 C46 64 43 60 44 56 Z" fill="#be123c"/>
    <path d="M43 56 C47 54 53 54 57 56" stroke="#18181b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M50 65 L50 72" stroke="#18181b" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M42 71 C46 73 50 73 50 73 C50 73 54 73 58 71" stroke="#18181b" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Presas Ferozes Levemente Visíveis -->
    <path d="M42 72 L43 76 L45 72 Z" fill="#fff" stroke="#18181b" stroke-width="0.8"/>
    <path d="M58 72 L57 76 L55 72 Z" fill="#fff" stroke="#18181b" stroke-width="0.8"/>

    <!-- Pintinhas do Focinho da Onça -->
    <circle cx="40" cy="65" r="1" fill="#18181b"/>
    <circle cx="43" cy="66" r="1" fill="#18181b"/>
    <circle cx="41" cy="69" r="1" fill="#18181b"/>
    <circle cx="44" cy="70" r="1" fill="#18181b"/>

    <circle cx="60" cy="65" r="1" fill="#18181b"/>
    <circle cx="57" cy="66" r="1" fill="#18181b"/>
    <circle cx="59" cy="69" r="1" fill="#18181b"/>
    <circle cx="56" cy="70" r="1" fill="#18181b"/>

    <!-- Bigodes Curtos e Agressivos -->
    <path d="M37 66 L21 64" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M36 69 L19 71" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M38 72 L23 77" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round"/>

    <path d="M63 66 L79 64" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M64 69 L81 71" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M62 72 L77 77" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Queixo da Onça -->
    <path d="M45 76 C47 82 53 82 55 76 Z" fill="#f8fafc" stroke="#18181b" stroke-width="1.2"/>
  </g>
</svg>
