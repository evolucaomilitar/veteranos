<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 512px;
      height: 512px;
      background: radial-gradient(circle, #1a2f1c 0%, #0a110b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    img {
      width: 440px;
      height: 440px;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.8));
    }
  </style>
</head>
<body>
  <img src="logo.svg" alt="Icon">
</body>
</html>
