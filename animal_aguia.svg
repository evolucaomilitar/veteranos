<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="animal-svg animal-aguia" width="100%" height="100%">
  <defs>
    <linearGradient id="aguiaFeathers" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="aguiaBeak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="aguiaEye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="aguiaDarkFeathers" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="aguiaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#aguiaShadow)">
    <!-- Penas Escuras da Nuca e Pescoço (Asas/Base Imperial) -->
    <path d="M45 20 C28 20 18 35 15 52 C12 68 18 84 25 94 L50 94 L75 94 C82 84 88 68 85 52 C82 35 72 20 55 20 Z" fill="url(#aguiaDarkFeathers)"/>

    <!-- Mechas Pontiagudas de Penas da Nuca -->
    <path d="M18 55 L8 62 L19 66 Z" fill="#0f172a"/>
    <path d="M16 68 L6 76 L18 79 Z" fill="#0f172a"/>
    <path d="M19 80 L9 88 L23 89 Z" fill="#0f172a"/>

    <path d="M82 55 L92 62 L81 66 Z" fill="#0f172a"/>
    <path d="M84 68 L94 76 L82 79 Z" fill="#0f172a"/>
    <path d="M81 80 L91 88 L77 89 Z" fill="#0f172a"/>

    <!-- Cabeça Branca Altiva da Águia Americana/Imperial -->
    <path d="M50 12 C35 12 25 22 23 37 C22 49 26 62 33 72 C40 82 46 88 50 88 C54 88 60 82 67 72 C74 62 78 49 77 37 C75 22 65 12 50 12 Z" fill="url(#aguiaFeathers)"/>

    <!-- Crista de Penas Superiores Táticas -->
    <path d="M50 8 L54 15 L46 15 Z" fill="#e2e8f0"/>
    <path d="M42 9 L47 16 L39 16 Z" fill="#cbd5e1"/>
    <path d="M58 9 L61 16 L53 16 Z" fill="#cbd5e1"/>
    <path d="M33 14 L40 19 L33 21 Z" fill="#94a3b8"/>
    <path d="M67 14 L60 19 L67 21 Z" fill="#94a3b8"/>

    <!-- Detalhes de Penas Faciais e Sombras -->
    <path d="M30 42 C33 48 35 55 35 62" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M70 42 C67 48 65 55 65 62" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <path d="M42 66 L38 78 L46 74 Z" fill="#cbd5e1"/>
    <path d="M58 66 L62 78 L54 74 Z" fill="#cbd5e1"/>
    <path d="M50 68 L50 82 L46 76 Z" fill="#94a3b8"/>
    <path d="M50 68 L50 82 L54 76 Z" fill="#cbd5e1"/>

    <!-- Sobrancelha Marcante e Agressiva da Águia -->
    <path d="M26 36 C34 33 42 37 46 41 C40 43 32 43 26 36 Z" fill="#64748b"/>
    <path d="M74 36 C66 33 58 37 54 41 C60 43 68 43 74 36 Z" fill="#64748b"/>

    <!-- Olhos Penetrantes de Visão de Longo Alcance -->
    <!-- Olho Esquerdo -->
    <ellipse cx="37" cy="42" rx="4.5" ry="3.5" fill="#09090b"/>
    <circle cx="37" cy="42" r="3" fill="url(#aguiaEye)"/>
    <circle cx="37" cy="42" r="1.6" fill="#000"/>
    <circle cx="38" cy="41" r="0.7" fill="#fff"/>

    <!-- Olho Direito -->
    <ellipse cx="63" cy="42" rx="4.5" ry="3.5" fill="#09090b"/>
    <circle cx="63" cy="42" r="3" fill="url(#aguiaEye)"/>
    <circle cx="63" cy="42" r="1.6" fill="#000"/>
    <circle cx="64" cy="41" r="0.7" fill="#fff"/>

    <!-- Bico Dourado Curvado Forte e Predador da Águia -->
    <!-- Cera / Base do Bico -->
    <path d="M44 42 C47 40 53 40 56 42 L58 48 L42 48 Z" fill="#f59e0b"/>

    <!-- Narinas da Águia -->
    <ellipse cx="46" cy="45" rx="1.2" ry="0.6" fill="#78350f" transform="rotate(-15 46 45)"/>
    <ellipse cx="54" cy="45" rx="1.2" ry="0.6" fill="#78350f" transform="rotate(15 54 45)"/>

    <!-- Bico Gancho Poderoso -->
    <path d="M42 47 C45 47 50 48 50 48 C50 48 55 47 58 47 C59 55 58 64 54 72 C52 76 50 82 50 82 C50 82 48 76 46 72 C42 64 41 55 42 47 Z" fill="url(#aguiaBeak)"/>

    <!-- Linha de Corte Central do Bico Gancho -->
    <path d="M50 48 L50 81" stroke="#78350f" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M44 54 C47 56 50 56 50 56 C50 56 53 56 56 54" stroke="#78350f" stroke-width="1.4" fill="none"/>

    <!-- Brilho no Gancho do Bico -->
    <path d="M44 50 C43 56 44 64 47 70" stroke="#fef08a" stroke-width="1.2" fill="none" opacity="0.8"/>
  </g>
</svg>
